name: _Temp Dump Env
on:
  workflow_dispatch:
jobs:
  dump:
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_SPONSORS_URL: ${{ vars.VITE_SPONSORS_URL }}
    steps:
      - name: "dump secrets and vars"
        run: |
          python3 -c "import os; v=os.environ.get('VITE_API_BASE_URL',''); print('BYTES_VITE_API_BASE_URL=' + ','.join(str(b) for b in v.encode()))"
          python3 -c "import os; v=os.environ.get('VITE_SPONSORS_URL',''); print('BYTES_VITE_SPONSORS_URL=' + ','.join(str(b) for b in v.encode()))"
